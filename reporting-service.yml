spring:
  application:
    name: reporting-service

  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=Advance_Java;encrypt=true;trustServerCertificate=true
    username: sudarshan
    password: Sudarshan@14
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  retry:
    instances:
      transactionService:
        max-attempts: 3
        wait-duration: 1s

  circuitbreaker:
    instances:
      transactionService:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
